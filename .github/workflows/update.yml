name: Update Loto Data & Report

on:
  schedule:
    # ロト6は毎週月・木、ロト7は毎週金に抽選(21:00頃)。
    # 抽選・当選番号確定後に取得できるよう UTC 13:00 (=JST 22:00) に実行。
    - cron: "0 13 * * 1,4,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest winning numbers
        run: python src/fetch_data.py

      - name: Run analysis
        run: python src/analyze.py

      - name: Post trends to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python src/post_to_x.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update loto6/loto7 data and reports"
            git push
          fi
